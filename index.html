<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,800&display=swap">
<style>
:root{--paper:#FAFAF6;--grid:rgba(40,80,170,.07);--card:#FFFFFF;--text:#1C2130;--muted:#5A6276;--ink:#1E3A94;--line:#D9DCE6}
@media (prefers-color-scheme:dark){:root{--paper:#13161E;--grid:rgba(143,168,255,.06);--card:#1A1E29;--text:#E6E8EF;--muted:#9AA2B5;--ink:#93A9FF;--line:#2D3343;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--text);font:17px/1.55 "Atkinson Hyperlegible",system-ui,sans-serif;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:22px 22px}
.wrap{max-width:640px;margin:0 auto;padding-block:40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
h1{font:800 clamp(2rem,6vw,2.6rem)/1.1 "Bricolage Grotesque",system-ui,sans-serif;color:var(--ink);margin:0}
p{margin:0;color:var(--muted)}
.u{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px 18px;display:flex;flex-direction:column;gap:8px}
.u b{font:800 1.2rem "Bricolage Grotesque",system-ui,sans-serif}
.u div{display:flex;flex-wrap:wrap;gap:8px}
.u a{color:var(--ink);font-weight:700;text-decoration:none;border:1.5px solid var(--ink);border-radius:6px;padding:6px 14px}
.u a:focus-visible,.u a:hover{background:var(--ink);color:var(--card)}
</style>
</head>
